name: check-build-test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Strict check build and test
        run: |
          moon version --all
          moon check --target all --deny-warn
          moon build --target all --deny-warn
          moon test --target all --deny-warn
      - name: Formatting and API consistency
        run: |
          moon fmt --check
          moon info
          git diff --exit-code
      - name: Application scenarios and scale workload
        run: |
          moon run examples/log_export --target native --deny-warn
          moon run examples/etl --target native --deny-warn
          moon run examples/offline_analysis --target native --deny-warn
          moon run examples/scale --target native --release --deny-warn
      - name: Independent Apache ORC oracle
        run: |
          python -m pip install -r scripts/requirements-interop.txt
          python scripts/interop.py verify _build/native/debug/build/cmd/main/main.exe
      - name: Audit source scale and local package
        run: |
          moon package
          python scripts/verify_repository.py
